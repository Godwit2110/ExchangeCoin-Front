<div class="admin-button-container">
  <button [routerLink]="['/admin/coins']" class="admin-button">
    Manage Coins
  </button>
</div>
<p class="title1">Users List</p>
<div class="titles">
  <p>Username</p>
  <p>Email</p>
  <p>Role</p>
  <p>Subscription Id</p>
</div>

<div class="Column" *ngFor="let UserView of Users">
  <p>{{ UserView.username }}</p>
  <p>{{ UserView.email }}</p>
  <p>{{ UserView.role }}</p>
  <p>{{ UserView.subsId }}</p>
</div>
